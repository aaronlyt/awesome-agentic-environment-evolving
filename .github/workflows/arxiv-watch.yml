name: arxiv-watch

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new arXiv candidates
        run: python .github/scripts/arxiv_watch.py

      - name: Commit new candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/arxiv-watch.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(arxiv-watch): add new candidates"
            git push
          fi
